<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparison Vanilla and Next: Like button</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
      body {
        display: flex;
        gap: 75px;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      button {
        font-family: "Roboto", sans-serif;
        font-weight: 900;
        font-size: 8rem;
        padding: 30px 70px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 250px;
        cursor: pointer;
      }
      span {
        margin-left: 25px;
      }
    </style>
  </head>
  <body>
    <script>
      const likeButton = () => {
        const body = document.querySelector("body");
        const id = Math.random().toString(36).substr(2, 9);
        let likes = 0;

        const buttonElement = document.createElement("button");
        buttonElement.className = id;
        buttonElement.innerHTML = `🔥 Like <span class="${id}"></span>`;
        body.appendChild(buttonElement);

        buttonElement.addEventListener("click", () => {
          likes += 1;
          if (likes != "") {
            buttonElement.innerHTML = `🔥 Likes <span class="${id}">${likes}</span>`;
          }
        });
      };

      likeButton();
    </script>
  </body>
</html>
