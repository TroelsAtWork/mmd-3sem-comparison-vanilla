<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparing Vanilla JS and Next.js: Like Button Example</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
      body {
        display: flex;
        gap: 75px;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
        margin: 0;
      }
      button {
        font-family: "Roboto", sans-serif;
        font-weight: 900;
        font-size: 10rem;
        padding: 30px 70px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 250px;
        cursor: pointer;
      }
      p {
        font-size: xx-large;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        let likes = 0;
        const button = document.querySelector("button");
        button.addEventListener("click", function () {
          console.log("Button clicked");
          likes = likes + 1;
          if (likes <= 1) {
            button.innerHTML = `🔥 Like ${likes}`;
          } else {
            button.innerHTML = `🔥 Likes ${likes}`;
          }
        });
      });
    </script>
  </head>
  <body>
    <button>🔥 Like</button>
  </body>
</html>
